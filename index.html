<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Customer Churn Prediction</h1>
    <form id="churnForm">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" step="0.1" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="gender_female" name="gender" value="0" required> Female<br>
        <input type="radio" id="gender_male" name="gender" value="1" required> Male<br><br>

        <label for="tenure">Tenure:</label>
        <input type="number" id="tenure" name="tenure" step="0.1" required><br><br>

        <label for="usage_frequency">Usage Frequency:</label>
        <input type="number" id="usage_frequency" name="usage_frequency" step="0.1" required><br><br>

        <label for="support_calls">Support Calls:</label>
        <input type="number" id="support_calls" name="support_calls" step="0.1" required><br><br>

        <label for="payment_delay">Payment Delay:</label>
        <input type="number" id="payment_delay" name="payment_delay" step="0.1" required><br><br>

        <label for="total_spend">Total Spend:</label>
        <input type="number" id="total_spend" name="total_spend" step="0.01" required><br><br>

        <label for="last_interaction">Last Interaction:</label>
        <input type="number" id="last_interaction" name="last_interaction" step="0.1" required><br><br>

        <label>Subscription Type:</label><br>
        <input type="radio" id="sub_premium" name="subscription" value="premium" required> Premium<br>
        <input type="radio" id="sub_standard" name="subscription" value="standard" required> Standard<br><br>

        <label>Contract Length:</label><br>
        <input type="radio" id="con_monthly" name="contract" value="monthly" required> Monthly<br>
        <input type="radio" id="con_quarterly" name="contract" value="quarterly" required> Quarterly<br><br>

        <button type="submit">Predict Churn</button>
    </form>
    <div id="predictionResult"></div>
    <script src="script.js"></script>
</body>
</html>
