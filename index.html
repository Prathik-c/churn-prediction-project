<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Churn Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">

    <div class="header">
      <div class="badge"><span class="dot"></span>ML Model Active</div>
      <h1>Churn Prediction</h1>
      <p class="sub">Enter customer details below to get an instant churn risk assessment.</p>
    </div>

    <div class="form-card">

      <div class="section">
        <p class="section-label">Customer Profile</p>
        <div class="grid-2">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="e.g. 34" min="18" max="100" step="1">
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="" disabled selected>Select gender</option>
              <option value="0">Female</option>
              <option value="1">Male</option>
            </select>
          </div>
          <div class="field">
            <label for="tenure">Tenure (months)</label>
            <input type="number" id="tenure" placeholder="e.g. 24" min="0" step="1">
          </div>
          <div class="field">
            <label for="last_interaction">Last Interaction (days)</label>
            <input type="number" id="last_interaction" placeholder="e.g. 14" min="0" step="1">
          </div>
        </div>
      </div>

      <div class="section">
        <p class="section-label">Usage & Support</p>
        <div class="grid-2">
          <div class="field">
            <label for="usage_frequency">Usage Frequency (days/mo)</label>
            <input type="number" id="usage_frequency" placeholder="e.g. 15" min="0" step="1">
          </div>
          <div class="field">
            <label for="support_calls">Support Calls</label>
            <input type="number" id="support_calls" placeholder="e.g. 3" min="0" step="1">
          </div>
        </div>
      </div>

      <div class="section">
        <p class="section-label">Billing & Plan</p>
        <div class="grid-3">
          <div class="field">
            <label for="total_spend">Total Spend ($)</label>
            <input type="number" id="total_spend" placeholder="e.g. 499.00" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="payment_delay">Payment Delay (days)</label>
            <input type="number" id="payment_delay" placeholder="e.g. 5" min="0" step="1">
          </div>
          <div class="field">
            <label for="subscription">Subscription Type</label>
            <select id="subscription">
              <option value="" disabled selected>Select plan</option>
              <option value="basic">Basic</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="field">
            <label for="contract">Contract Length</label>
            <select id="contract">
              <option value="" disabled selected>Select contract</option>
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="annual">Annual</option>
            </select>
          </div>
        </div>
      </div>

      <div class="footer">
        <span class="footer-hint">Connects to <code>localhost:8000/predict</code></span>
        <button class="predict-btn" id="predictBtn" onclick="runPrediction()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="6" stroke="white" stroke-width="1.5"/>
            <path d="M5 7l1.5 1.5L9 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Predict Churn
        </button>
      </div>

    </div>

    <div class="result-area" id="resultArea">
      <div class="result-banner" id="resultBanner">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-text">
          <p class="result-title" id="resultTitle"></p>
          <p class="result-sub" id="resultSub"></p>
        </div>
        <span class="result-label" id="resultLabel"></span>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
